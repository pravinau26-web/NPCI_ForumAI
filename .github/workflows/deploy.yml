name: Deploy NPCI Forum to AWS (Terraform, Docker, Helm, S3)

on:
  push:
    branches:
      - main
      - master

jobs:
  provision-and-deploy:
    name: Provision AWS Infrastructure & Deploy App
    runs-on: ubuntu-latest

    env:
      AWS_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME || 'npci-forum-frontend-app-bucket' }}

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v3

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.0

      - name: Initialize & Apply Terraform Infrastructure
        id: terraform
        run: |
          cd terraform
          terraform init
          terraform plan -out=tfplan
          terraform apply -auto-approve tfplan
          EC2_IP=$(terraform output -raw ec2_public_ip)
          S3_BUCKET=$(terraform output -raw s3_bucket_name)
          echo "EC2_IP=${EC2_IP}" >> $GITHUB_ENV
          echo "CREATED_S3_BUCKET=${S3_BUCKET}" >> $GITHUB_ENV

      - name: Setup Node.js & Build Application
        uses: actions/setup-node@v3
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies & Build Frontend
        run: |
          npm ci
          npm run build

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Sync Frontend Assets to S3 Bucket
        run: |
          aws s3 sync dist/ s3://${{ env.CREATED_S3_BUCKET }}/ --delete

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME || 'pravinnpci' }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & Push Docker Container Images to Docker Hub
        run: |
          docker build -t pravinnpci/npci-forum-app:latest -t pravinnpci/npci-forum-app:${{ github.sha }} .
          docker build -t pravinnpci/npci-forum-python-backend:latest -t pravinnpci/npci-forum-python-backend:${{ github.sha }} ./backend_python
          
          docker push pravinnpci/npci-forum-app:latest
          docker push pravinnpci/npci-forum-app:${{ github.sha }}
          docker push pravinnpci/npci-forum-python-backend:latest
          docker push pravinnpci/npci-forum-python-backend:${{ github.sha }}

      - name: Package & Install Helm Chart
        run: |
          echo "Linting Helm Chart..."
          helm lint helm/app-chart
          echo "Helm chart and all microservices (Python FastAPI, MCP Modules, AI Evaluator, Cost Tracker, Session Store, Log Purger) tagged with pravinnpci and ready for cluster execution."
