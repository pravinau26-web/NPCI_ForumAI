apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-mcp-forum
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Release.Name }}-mcp-forum
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-mcp-forum
    spec:
      containers:
        - name: mcp-forum
          image: python:3.11-slim
          command: ["sh", "-c", "pip install fastapi uvicorn pydantic && python /app/mcp_servers/mcp_forum_server.py"]
          ports:
            - containerPort: 8001
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-forum-service
spec:
  ports:
    - port: 8001
      targetPort: 8001
  selector:
    app: {{ .Release.Name }}-mcp-forum
---
