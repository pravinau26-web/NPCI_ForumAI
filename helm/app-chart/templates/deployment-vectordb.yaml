apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-vectordb
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Release.Name }}-vectordb
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-vectordb
    spec:
      containers:
        - name: vectordb
          image: {{ .Values.vectordb.image }}
          ports:
            - containerPort: 6333
          volumeMounts:
            - mountPath: /qdrant/storage
              name: vectordb-storage
      volumes:
        - name: vectordb-storage
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-vectordb-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: vector-db-service
spec:
  selector:
    app: {{ .Release.Name }}-vectordb
  ports:
    - port: 6333
      targetPort: 6333
