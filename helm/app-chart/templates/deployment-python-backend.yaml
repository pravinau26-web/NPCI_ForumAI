apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-python-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Release.Name }}-python-backend
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-python-backend
    spec:
      containers:
        - name: python-fastapi
          image: pravinnpci/npci-forum-python-backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          env:
            - name: PORT
              value: "8000"
            - name: NODE_ENV
              value: "production"
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: python-backend-service
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: 8000
  selector:
    app: {{ .Release.Name }}-python-backend
